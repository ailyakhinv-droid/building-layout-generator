# Нормативные параметры по умолчанию
# Противопожарные разрывы
fire_gap_min: 6            # метры, минимальный противопожарный разрыв между зданиями
fire_gap_high_rise: 15     # метры, для зданий выше 10 этажей

# Инсоляция
insolation_factor: 0.5     # минимальное расстояние = коэффициент * высота здания

# Отступы
red_line_setback: 5        # метры, отступ от красной линии
boundary_setback: 6        # метры, нормативный отступ от границы участка (пожарный проезд + буфер)
building_max_length: 90    # метры, макс. длина корпуса без сквозных проездов (СП 42.13330)
passage_gap_min: 18        # метры, ширина пешеходно-пожарного бульвара/разрыва между домами
block_max_width: 85        # метры, комфортная ширина квартальной скобы со двором

# Озеленение
green_ratio_min: 0.25      # 25% минимальная доля озеленения

# Парковка
parking_ratio: 0.5         # машиномест на квартиру

# Высоты этажей
floor_height: 3.0          # метры, высота типового этажа
ground_floor_height: 4.5   # метры, высота первого этажа (коммерция)
max_building_height_m: 0.0 # метры, предельная высота здания (0 = без ограничения по ПЗЗ/ГПЗУ)

# Население
population_per_1k: 2.8     # человек на 1-комнатную квартиру
population_per_2k: 3.6     # человек на 2-комнатную квартиру
population_per_3k: 4.5     # человек на 3-комнатную квартиру

# Плотность застройки
max_bcr: 0.40              # максимальный процент застройки (40%)
max_far: 2.5               # максимальный коэффициент плотности застройки
